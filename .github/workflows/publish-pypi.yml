name: Build and publish to PyPI on tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels-linux:
    name: Linux wheels (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: manylinux_x86_64
            runner: ubuntu-22.04
            arch: x86_64
          - target: musllinux_x86_64
            runner: ubuntu-22.04
            arch: x86_64
          # Native ARM runners (GA since 2025) replace QEMU emulation and cut
          # aarch64 build time by ~5x.
          - target: manylinux_aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - target: musllinux_aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install "cibuildwheel>=3.0.0"

      - name: Build wheels
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BUILD: "cp39-${{ matrix.target }} cp310-${{ matrix.target }} cp311-${{ matrix.target }} cp312-${{ matrix.target }} cp313-${{ matrix.target }} cp314-${{ matrix.target }}"
          # manylinux/musllinux containers need their own Rust toolchain.
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && source ~/.cargo/env"
          CIBW_ENVIRONMENT: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: wheelhouse/*.whl
          retention-days: 7

  build-wheels-macos:
    name: macOS wheels
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add x86_64 Rust target for universal macOS builds
        run: rustup target add x86_64-apple-darwin

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install "cibuildwheel>=3.0.0"

      - name: Build wheels
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          MACOSX_DEPLOYMENT_TARGET: "10.12"
          CIBW_TEST_REQUIRES: pytest
          # cibuildwheel skips tests when building a wheel for a foreign arch
          # (x86_64 on arm64 host). Keep the command anyway; it's a no-op there.
          CIBW_TEST_COMMAND: "pytest {project}/tests"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: wheelhouse/*.whl
          retention-days: 7

  build-wheels-windows:
    name: Windows wheels
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install "cibuildwheel>=3.0.0"

      - name: Build wheels
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
          retention-days: 7

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: [build-wheels-linux, build-wheels-macos, build-wheels-windows, build-sdist]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    # Only one release may run at a time, but never cancel an in-flight upload.
    concurrency:
      group: pypi-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write  # required for OIDC trusted publishing
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "wheels-*"
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List files to upload
        run: ls -al dist

      # Uses PyPI Trusted Publishing via OIDC -- no API token needed.
      # Requires a pending publisher configured at
      # https://pypi.org/manage/project/jieba-next/settings/publishing/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
