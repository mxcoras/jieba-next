name: Test PR builds

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same PR / branch to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: ruff check
        run: ruff check src tests

      - name: ruff format --check
        run: ruff format --check src tests

  fast-tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # setuptools_scm needs tags

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install package (editable) + pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run pytest
        run: pytest tests/ -v

  build-and-test-linux:
    name: cibw wheel on Linux (${{ matrix.python }})
    needs: fast-tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Cover the lower and upper supported Python bounds in PR to catch
        # version-specific regressions without running the full matrix.
        python: [cp39, cp314]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install "cibuildwheel>=3.0.0"

      - name: Build and test wheel
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ARCHS_LINUX: x86_64
          CIBW_BUILD: ${{ matrix.python }}-manylinux_x86_64
          # manylinux container needs its own Rust toolchain.
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && source ~/.cargo/env"
          CIBW_ENVIRONMENT: "PATH=$HOME/.cargo/bin:$PATH"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: test-wheels-linux-${{ matrix.python }}
          path: wheelhouse/*.whl
          retention-days: 7

  build-and-test-macos:
    name: cibw wheel on macOS (${{ matrix.python }})
    needs: fast-tests
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python: [cp39, cp314]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install "cibuildwheel>=3.0.0"

      - name: Build and test wheel
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: ${{ matrix.python }}-*
          MACOSX_DEPLOYMENT_TARGET: "10.12"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: test-wheels-macos-${{ matrix.python }}
          path: wheelhouse/*.whl
          retention-days: 7

  build-and-test-windows:
    name: cibw wheel on Windows (${{ matrix.python }})
    needs: fast-tests
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: [cp39, cp314]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          pip install "cibuildwheel>=3.0.0"

      - name: Build and test wheel
        env:
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: ${{ matrix.python }}-*
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: "pytest {project}/tests"
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: test-wheels-windows-${{ matrix.python }}
          path: wheelhouse/*.whl
          retention-days: 7

  test-sdist:
    name: sdist build + pytest
    needs: fast-tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --outdir dist

      - name: Install sdist and run pytest
        run: |
          pip install dist/*.tar.gz pytest
          pytest tests/ -v

      - uses: actions/upload-artifact@v4
        with:
          name: test-sdist
          path: dist/*.tar.gz
          retention-days: 7
